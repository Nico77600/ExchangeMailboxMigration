<script>
(() => {
  "use strict";
  const el = id => document.getElementById(id);
  const data = JSON.parse(el("report-data").textContent);
  const meta = data.meta || {}, kind = data.kind;
  const rowsOf = name => { const t = (data.tables || {})[name]; if (!t) return []; return t.rows.map(r => { const o = {}; t.columns.forEach((c, i) => { o[c] = r[i]; }); return o; }); };
  const columnsOf = name => ((data.tables || {})[name] || { columns: [] }).columns;
  const nf = new Intl.NumberFormat("en-GB");
  const number = n => n == null || n === "" ? "" : nf.format(n);
  const size = mb => { if (mb == null || mb === "") return ""; mb = Number(mb); return mb >= 1048576 ? (mb / 1048576).toFixed(2) + " TB" : mb >= 1024 ? (mb / 1024).toFixed(1) + " GB" : Math.round(mb) + " MB"; };
  const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
  const sum = (rows, k) => rows.reduce((s, r) => s + (Number(r[k]) || 0), 0);
  const h = (tag, attrs, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
    }

    return e;
  };
  const ICONS = {
    mailbox: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 6 9 7 9-7"/>',
    system: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
    people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',

    check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    sync: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/>',
    alert: '<path d="M12 3 2 20h20z"/><path d="M12 9v5M12 17v.5"/>',
    play: '<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/>',
    skip: '<path d="m5 5 7 7-7 7M13 5l7 7-7 7"/>',
    flask: '<path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>'
  };
  const icon = (name, cls) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.6"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true"); if (cls) s.setAttribute("class", cls); s.innerHTML = ICONS[name] || ICONS.info; return s; };

  // ---- Status vocabulary --------------------------------------------------------------------------
  const groupOf = s => /^(Completed|CompletedWithWarning|CompletedWithErrors|Finalized)$/.test(s) ? "Completed"
    : /^(Synced|AutoSuspended)$/.test(s) ? "Ready"
    : /^(Failed|Suspended|Stopped|Corrupted|IncrementalSyncFailed|CompletionFailed|SyncFailed)$/.test(s) ? "Failed" : "InProgress";

  let view = gridRows.slice();
  const text = r => Object.values(r).map(v => v == null ? "" : String(v)).join("\u0001").toLowerCase();
  const haystack = gridRows.map(text);
  const index = new Map(gridRows.map((r, i) => [r, i]));
  function applyFilters() {
    const q = el("search").value.trim().toLowerCase();
    const active = filterKeys.map(([k]) => [k, el("filter-" + k).value]).filter(([, v]) => v !== "");
    view = gridRows.filter((r, i) => (!q || haystack[i].includes(q)) && active.every(([k, v]) => String(r[k] == null ? "" : r[k]) === v));
    try { sessionStorage.setItem(STORE, JSON.stringify({ q: el("search").value, f: Object.fromEntries(filterKeys.map(([k]) => [k, el("filter-" + k).value])) })); } catch (e) { }
    sortView(); render(true);
  }
  function sortView() {
    if (sortIndex < 0) return;
    const key = columns[sortIndex].sort || (r => String(columns[sortIndex].cell(r)));
    view.sort((a, b) => { const x = key(a), y = key(b); const c = typeof x === "number" && typeof y === "number" ? x - y : String(x == null ? "" : x).localeCompare(String(y == null ? "" : y), "en", { numeric: true }); return sortAsc ? c : -c; });
  }
  const ROW = 36, viewport = el("viewport"), spacer = el("spacer");
  function render(reset) {
    if (reset) viewport.scrollTop = 0;
    spacer.style.height = `${view.length * ROW}px`;
    el("empty").hidden = view.length > 0;
    el("result-state").textContent = view.length === gridRows.length ? `${number(view.length)} rows` : `${number(view.length)} of ${number(gridRows.length)} rows`;
    const first = Math.max(0, Math.floor(viewport.scrollTop / ROW) - 10);
    const last = Math.min(view.length, Math.ceil((viewport.scrollTop + viewport.clientHeight) / ROW) + 10);
    const fragment = document.createDocumentFragment();
    for (let p = first; p < last; p++) {
      const r = view[p], line = h("div", { class: "grid-row", role: "row", style: `top:${p * ROW}px`, "data-row": index.get(r), tabindex: "0" });
      for (const c of columns) { const v = c.cell(r); const cell = h("div", { class: c.cls || null }); if (v instanceof Node) cell.append(v); else { cell.textContent = v == null ? "" : v; cell.title = v == null ? "" : v; } line.append(cell); }
      fragment.append(line);
    }
    spacer.replaceChildren(fragment);
  }
  let ticking = false;
  viewport.addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { render(false); ticking = false; }); } });
  window.addEventListener("resize", () => render(false));

  // ---- Details dialog ----------------------------------------------------------------------------------------
  function showDetails(i) {
    const r = gridRows[i], dl = el("detail-fields");
    el("detail-title").textContent = detailTitle(r);
    dl.replaceChildren();
    for (const k of columnsOf(gridTable)) { const v = r[k]; if (v == null || v === "") continue; dl.append(h("dt", null, k), h("dd", null, typeof v === "number" && /MB$/.test(k) ? `${size(v)} (${number(v)} MB)` : String(v))); }
    el("detail").showModal();
  }
  spacer.addEventListener("click", e => { const r = e.target.closest(".grid-row"); if (r) showDetails(Number(r.dataset.row)); });
  spacer.addEventListener("keydown", e => { if (e.key === "Enter") { const r = e.target.closest(".grid-row"); if (r) showDetails(Number(r.dataset.row)); } });
  el("detail-close").addEventListener("click", () => el("detail").close());

  // ---- Export of the current view --------------------------------------------------------------------------------
  el("export").addEventListener("click", () => {
    const cols = columnsOf(gridTable);
    const esc = v => { v = v == null ? "" : String(v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return /[";\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
    const lines = ["\ufeff" + cols.map(esc).join(";")];
    for (const r of view) lines.push(cols.map(c => esc(r[c])).join(";"));
    const a = h("a", { href: URL.createObjectURL(new Blob([lines.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" })), download: `${kind.toLowerCase()}-view.csv` });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });

  // ---- Wiring, saved filters and automatic refresh ------------------------------------------------------------------
  let timer = null;
  el("search").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(applyFilters, 200); });
  el("clear-filters").addEventListener("click", () => { el("search").value = ""; for (const [k] of filterKeys) el("filter-" + k).value = ""; document.querySelectorAll(".batch").forEach(b => b.classList.remove("active")); applyFilters(); });
  try { const saved = JSON.parse(sessionStorage.getItem(STORE) || "null"); if (saved && meta.refreshSeconds) { el("search").value = saved.q || ""; for (const [k] of filterKeys) { const s = el("filter-" + k); if (saved.f && saved.f[k] != null && Array.from(s.options).some(o => o.value === saved.f[k])) s.value = saved.f[k]; } } } catch (e) { }
  if (meta.refreshSeconds > 0) setTimeout(() => window.location.reload(), meta.refreshSeconds * 1000);
  el("footer").textContent = `Generated ${meta.generated} by ${meta.tool || "Exchange Mailbox Migration"} ${meta.toolVersion || ""} (${meta.author || ""}). Sizes include recoverable items (what a move copies). This report contains mailbox names and e-mail addresses: store and share it accordingly.`;
  applyFilters();
})();
</script>
</body></html>
